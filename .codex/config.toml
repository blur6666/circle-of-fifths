# Codex IDE/CLI cannot use the ChatGPT desktop app's built-in @Browser surface.
# This project-scoped MCP server supplies equivalent browser automation for
# local implementation checks. Project config loads only after the repo is
# trusted, and Codex must be restarted after this file changes.
[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.78",
  "--browser",
  "msedge",
  "--headless",
  "--isolated",
]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true
required = false
