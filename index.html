<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Circle of Fifths</title>
<!-- Resource hints, not styling — the fonts themselves are @import-ed by style.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>The Circle of Fifths</h1>

<div class="controls">
  <div class="arrows">
    <button class="arrow" data-step="-1" aria-label="Previous key">&lsaquo;</button>
    <button class="arrow" data-step="1" aria-label="Next key">&rsaquo;</button>
  </div>
  <label class="switch">
    <input type="checkbox" id="mask-toggle" checked>
    <span class="track"><span class="knob"></span></span>
    <span class="switch-text">Mask</span>
  </label>
</div>

<svg id="wheel" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Circle of fifths chart"></svg>

<div class="controls">
  <div class="arrows">
    <button class="arrow" data-step="-1" aria-label="Previous key">&lsaquo;</button>
    <button class="arrow" data-step="1" aria-label="Next key">&rsaquo;</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
