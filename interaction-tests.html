<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle of Fifths - interaction tests</title>
<style>
  body { background: #0a0b0f; color: #d8dbe8; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
         margin: 0; padding: 2rem; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 1rem; }
  #summary { font-size: 1.05rem; padding: .6rem .9rem; border-radius: 6px; margin: 0 0 1.2rem;
             background: #141720; }
  #summary.pass { color: #7ee2a8; }
  #summary.fail { color: #ff8f8f; }
  ol { margin: 0; padding-left: 2.4rem; }
  li { margin: .15rem 0; }
  li.pass::marker { color: #4d5570; }
  li.fail { color: #ff8f8f; }
  .tag { display: inline-block; width: 4.2rem; color: #4d5570; }
  li.fail .tag { color: #ff8f8f; }
  .detail { display: block; margin-left: 4.2rem; color: #ffbdbd; white-space: pre-wrap; }
  iframe { position: fixed; left: -1600px; top: 0; width: 1440px; height: 900px; border: 0; }
</style>
</head>
<body>

<h1>Circle of Fifths - interaction smoke tests</h1>
<p id="summary">running...</p>
<ol id="results"></ol>
<iframe id="app" src="index.html" title="Application under test"></iframe>

<script>
(function () {
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  const frame = document.getElementById('app');
  let passed = 0, failed = 0;

  function record(name, ok, detail) {
    const li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.innerHTML = `<span class="tag">${ok ? 'pass' : 'FAIL'}</span><span class="name"></span>`;
    li.querySelector('.name').textContent = name;
    if (!ok) {
      const d = document.createElement('span');
      d.className = 'detail';
      d.textContent = detail;
      li.appendChild(d);
    }
    results.appendChild(li);
    ok ? passed++ : failed++;
  }

  function eq(name, actual, expected) {
    record(name, Object.is(actual, expected), `expected: ${expected}\nactual:   ${actual}`);
  }

  function ok(name, condition, detail) {
    record(name, condition, detail || 'condition was false');
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  frame.addEventListener('load', async () => {
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const { KEYS, CX, CY } = win.CF.config;
    const { DUR } = win.CF.geometry;
    const wheelPrevious = doc.querySelector('[data-layer="wheel"][data-step="-1"]');
    const wheelNext = doc.querySelector('[data-layer="wheel"][data-step="1"]');
    const maskPrevious = doc.querySelector('[data-layer="mask"][data-step="-1"]');
    const maskNext = doc.querySelector('[data-layer="mask"][data-step="1"]');
    const reset = doc.getElementById('reset');
    const hideMask = doc.getElementById('hide-mask');
    const maskGlow = doc.getElementById('mask-glow-toggle');
    const wheelGlow = doc.getElementById('wheel-glow-toggle');
    const degreeDrones = doc.getElementById('degree-drone-toggle');
    const dimChords = doc.getElementById('dim-chord-toggle');
    const staffToggle = doc.getElementById('staff-toggle');
    const selected = () => doc.getElementById('dash-major').textContent;
    let frameId = 0;
    const frames = new Map();
    win.requestAnimationFrame = callback => {
      const id = ++frameId;
      frames.set(id, win.setTimeout(() => {
        frames.delete(id);
        callback(win.performance.now() + DUR);
      }, 0));
      return id;
    };
    win.cancelAnimationFrame = id => {
      const timer = frames.get(id);
      if (timer) win.clearTimeout(timer);
      frames.delete(id);
    };
    const settle = () => wait(20);
    const firstMajor = doc.querySelector('.major-label');
    const firstMajorAnchor = firstMajor.getAttribute('transform').slice('rotate(0'.length);

    eq('starts on C', selected(), KEYS[0].major);
    eq('formats the relative minor as a chord', doc.getElementById('dash-minor').textContent, 'Am');
    eq('formats minor chords in the dashboard', doc.getElementById('dash-chords').textContent,
      'C · Dm · Em · F · G · Am · B°');
    ok('animation disable toggles start enabled',
      maskGlow.checked && wheelGlow.checked && degreeDrones.checked &&
      doc.body.classList.contains('mask-glow-off') &&
      doc.body.classList.contains('wheel-glow-off') &&
      doc.body.classList.contains('degree-drones-off'),
      'one or more animation disable toggles are not applied by default');
    eq('disabled degree animation hides degree shadows',
      win.getComputedStyle(doc.querySelector('.shadow')).display, 'none');
    eq('disabled wheel glow really unlights the armed cue',
      win.getComputedStyle(doc.getElementById('arm-hub')).opacity, '0');
    eq('lists C modes by selected note then alphabetically', doc.getElementById('dash-modes').textContent,
      'C Ionian\nA Aeolian\nB Locrian\nD Dorian\nE Phrygian\nF Lydian\nG Mixolydian');
    eq('first screen has one guide link', doc.querySelectorAll('.guide .more').length, 1);
    eq('desktop player sits below the dashboard', win.getComputedStyle(doc.getElementById('key-player')).position, 'static');
    eq('wheel glow uses one line per cell boundary', doc.querySelectorAll('#arm-ring, #arm-hub').length, 2);
    eq('wheel glow omits duplicate boundary lines',
      doc.querySelectorAll('#arm-ring-outer, #arm-hub-inner').length, 0);

    /* The wheel opens stripped back: no mask, no staffs, no diminished ring. */
    eq('the mask starts hidden', doc.getElementById('mask').style.display, 'none');
    eq('the mask label offers to show it', hideMask.getAttribute('aria-label'), 'Show mask');
    ok('the mask starts marked as pressed', hideMask.getAttribute('aria-pressed') === 'true' &&
      hideMask.classList.contains('is-hidden'),
      'the mask label does not reflect a hidden mask on load');
    ok('the mask arrows start greyed out rather than hidden',
      maskNext.disabled && maskPrevious.disabled &&
      win.getComputedStyle(maskNext).display !== 'none' &&
      win.getComputedStyle(maskNext.parentElement).display !== 'none',
      'the mask arrows are hidden or still live while the mask is hidden');
    eq('a dead mask arrow drops its glow',
      win.getComputedStyle(maskNext).boxShadow, 'none');
    eq('the dim chord toggle starts on', dimChords.checked, true);
    eq('the staff toggle starts on', staffToggle.checked, true);
    eq('the staffs start hidden', win.getComputedStyle(doc.getElementById('staves')).display, 'none');
    ok('the diminished ring starts off the wheel',
      [...doc.querySelectorAll('.dim-label, .dim-sector, .dim-seam')]
        .every(el => win.getComputedStyle(el).display === 'none'),
      'part of the diminished ring is still drawn on load');
    ok('the mask window starts closed over the diminished band',
      !doc.querySelector('#mask path:last-of-type').getAttribute('d')
        .includes(`A${win.CF.config.R_HUB} ${win.CF.config.R_HUB}`),
      'the mask window still dips into the hidden diminished ring on load');

    /* Everything below drives the wheel with all three layers on, so put them back. */
    hideMask.click();
    dimChords.checked = false;
    dimChords.dispatchEvent(new Event('change', { bubbles: true }));
    staffToggle.checked = false;
    staffToggle.dispatchEvent(new Event('change', { bubbles: true }));
    await settle();
    eq('showing the mask again reveals the window', doc.getElementById('mask').style.display, '');

    wheelPrevious.click();
    eq('wheel previous selects F', selected(), KEYS[KEYS.length - 1].major);
    wheelNext.click();
    eq('wheel next returns to C', selected(), KEYS[0].major);
    await settle();

    wheelNext.click();
    eq('wheel next selects G', selected(), KEYS[1].major);
    await settle();
    eq('wheel rotates one sector', doc.getElementById('disc').getAttribute('transform'),
      `rotate(${-win.CF.config.SECTOR} ${CX} ${CY})`);
    ok('wheel labels counter-rotate',
      firstMajor.getAttribute('transform').startsWith(`rotate(${win.CF.config.SECTOR} `),
      'the first major label did not rotate opposite to the disc');

    for (let i = 2; i < KEYS.length; i += 1) {
      wheelNext.click();
      eq(`wheel next selects ${KEYS[i].major}`, selected(), KEYS[i].major);
    }
    wheelNext.click();
    eq('wheel wraps to C after twelve steps', selected(), KEYS[0].major);
    await settle();
    eq('wheel labels remain counter-rotated after a full turn',
      firstMajor.getAttribute('transform'), `rotate(360${firstMajorAnchor}`);

    maskNext.click();
    eq('mask next selects G', selected(), KEYS[1].major);
    await settle();
    eq('mask rotates while wheel stays put', doc.getElementById('mask').getAttribute('transform'),
      `rotate(${win.CF.config.SECTOR} ${CX} ${CY})`);
    eq('mask mode keeps the wheel at its settled angle', doc.getElementById('disc').getAttribute('transform'),
      `rotate(${-360} ${CX} ${CY})`);
    ok('chord value stays on one line',
      doc.getElementById('dash-chords').scrollWidth <= doc.getElementById('dash-chords').clientWidth,
      'the chord value overflows its dashboard cell');
    ok('the narrowed dashboard still holds every chord list',
      [...doc.querySelectorAll('.dashboard-list dd')].every(dd => dd.scrollWidth <= dd.clientWidth),
      'a dashboard value overflows the narrowed panel');
    maskPrevious.click();
    eq('mask previous returns to C', selected(), KEYS[0].major);

    maskNext.click();
    await settle();
    ok('the wheel is off C before hiding the mask', selected() !== KEYS[0].major,
      'the mask did not move off C, so the reset-on-hide check proves nothing');
    hideMask.click();
    await settle();
    eq('hide-mask hides the window', doc.getElementById('mask').style.display, 'none');
    eq('hide-mask exposes a show action when hidden', hideMask.getAttribute('aria-label'), 'Show mask');
    eq('hide-mask resets the position to C', selected(), KEYS[0].major);
    eq('hide-mask winds the mask back to the top',
      doc.getElementById('mask').getAttribute('transform'), `rotate(0 ${CX} ${CY})`);
    ok('hide-mask greys the mask arrows out but leaves them in place',
      maskNext.disabled && maskPrevious.disabled &&
      win.getComputedStyle(maskNext.parentElement).display === 'flex',
      'the mask arrows were removed instead of being disabled');
    ok('the wheel arrows stay live while the mask is hidden',
      !wheelNext.disabled && !wheelPrevious.disabled,
      'hiding the mask disabled the wheel arrows too');
    wheelNext.click();
    await settle();
    ok('arming the wheel does not revive the mask arrows', maskNext.disabled,
      'the mask arrows came back to life when the wheel was armed');
    hideMask.click();
    await settle();
    eq('hide-mask restores the window', doc.getElementById('mask').style.display, '');
    ok('showing the mask brings its arrows back to life',
      !maskNext.disabled && !maskPrevious.disabled,
      'the mask arrows are still disabled after showing the mask');
    const beforeRevived = selected();
    maskNext.click();
    await settle();
    ok('the revived mask arrows turn the mask again', selected() !== beforeRevived,
      'the mask did not move once its arrows came back');

    ok('the key name in the middle has no ring around it',
      !doc.querySelector('#hub circle').hasAttribute('stroke'),
      'the hub circle still carries a rim stroke');

    staffToggle.checked = true;
    staffToggle.dispatchEvent(new Event('change', { bubbles: true }));
    eq('hiding the staffs takes the whole group off',
      win.getComputedStyle(doc.getElementById('staves')).display, 'none');
    ok('hiding the staffs applies its body class', doc.body.classList.contains('staves-off'));
    staffToggle.checked = false;
    staffToggle.dispatchEvent(new Event('change', { bubbles: true }));
    ok('showing the staffs restores the group',
      win.getComputedStyle(doc.getElementById('staves')).display !== 'none',
      'the staff group is still hidden');

    [
      [maskGlow, 'mask-glow-off', 'mask glow toggle'],
      [wheelGlow, 'wheel-glow-off', 'wheel glow toggle'],
      [degreeDrones, 'degree-drones-off', 'degree drone toggle']
    ].forEach(([toggle, className, name]) => {
      toggle.checked = true;
      toggle.dispatchEvent(new Event('change', { bubbles: true }));
      ok(`${name} applies its visual state`, doc.body.classList.contains(className));
      toggle.checked = false;
      toggle.dispatchEvent(new Event('change', { bubbles: true }));
      if (toggle === degreeDrones) {
        eq('enabled degree animation restores degree shadows',
          win.getComputedStyle(doc.querySelector('.shadow')).display, 'inline');
      }
    });

    const dimLabels = [...doc.querySelectorAll('.dim-label')];
    const dimSectors = [...doc.querySelectorAll('.dim-sector')];
    const dimSeams = [...doc.querySelectorAll('.dim-seam')];
    const dimParts = [...dimLabels, ...dimSectors, ...dimSeams];
    const maskEdgePath = () => doc.querySelector('#mask path:last-of-type').getAttribute('d');
    const hidden = el => win.getComputedStyle(el).display === 'none';

    eq('the diminished ring has a sector per key', dimSectors.length, KEYS.length);
    eq('the diminished ring has a label per key', dimLabels.length, KEYS.length);
    eq('each seam is split so its inner half can leave with the ring', dimSeams.length, KEYS.length);
    ok('dim chord toggle sits in the side panel beside Reset',
      doc.querySelector('.side #dim-chord-toggle') && reset.parentElement === doc.querySelector('.side'),
      'the dim chord toggle is not in the side panel with Reset');
    ok('staff toggle sits in the side panel beside Reset',
      doc.querySelector('.side #staff-toggle'),
      'the staff toggle is not in the side panel with Reset');
    ok('turning the dim toggle off puts the ring back on the wheel', dimParts.every(el => !hidden(el)),
      'part of the diminished ring is still hidden with the toggle off');

    const windowWithDim = maskEdgePath();
    ok('the mask window reaches the hub while the diminished ring is shown',
      windowWithDim.includes(`A${win.CF.config.R_HUB} ${win.CF.config.R_HUB}`),
      'the mask window does not frame the diminished cell');

    dimChords.checked = true;
    dimChords.dispatchEvent(new Event('change', { bubbles: true }));
    ok('hiding the diminished chords applies its body class', doc.body.classList.contains('dim-chords-off'));
    eq('hiding takes the whole diminished ring off the wheel',
      dimParts.filter(hidden).length, dimParts.length);
    /* #disc is duplicated into a <use href="#disc"> veil for the blur outside the mask
       window (spotlight.js). That clone only repaints on a direct style mutation of the
       source nodes, so hiding by body class alone leaves eleven of the twelve sectors
       still drawn in the veil. Computed style looks identical either way, so assert the
       inline style to catch a regression back to class-only hiding. */
    ok('the ring is hidden by inline style, not by the body class alone',
      dimParts.every(el => el.style.display === 'none'),
      'the diminished ring relies on the body class; the <use> veil clone would keep drawing it outside the window');
    // display:none on the group does not cascade into the child's *computed* display,
    // so test the group the label is drawn in rather than the label itself
    const viiDegree = [...doc.querySelectorAll('.degree-label')]
      .find(el => el.textContent === 'vii°').closest('.hover-container');
    ok('the vii° degree label leaves with the ring', hidden(viiDegree),
      'the vii° degree label is still shown without a diminished ring to sit in');

    const windowWithoutDim = maskEdgePath();
    ok('the mask window closes over the emptied band',
      !windowWithoutDim.includes(`A${win.CF.config.R_HUB} ${win.CF.config.R_HUB}`) &&
      windowWithoutDim !== windowWithDim,
      'the mask window still dips into the space the diminished ring occupied');
    ok('the scrim and the window edge agree on the new shape',
      doc.querySelector('#mask path').getAttribute('d').includes(windowWithoutDim),
      'the scrim was not recut to the reshaped window');

    dimChords.checked = false;
    dimChords.dispatchEvent(new Event('change', { bubbles: true }));
    ok('showing the diminished chords clears the body class', !doc.body.classList.contains('dim-chords-off'));
    eq('showing restores the whole diminished ring',
      dimParts.filter(el => !hidden(el)).length, dimParts.length);
    eq('showing restores the original mask window', maskEdgePath(), windowWithDim);

    reset.click();
    eq('Reset restores C', selected(), KEYS[0].major);
    ok('Reset preserves mask mode', doc.body.classList.contains('armed-mask'), 'mask mode was not armed after Reset');

    const beforePlayback = selected();
    doc.getElementById('key-player').click();
    eq('playback does not change the selected key', selected(), beforePlayback);

    const staves = [...doc.querySelectorAll('.staff')];
    eq('all staff descriptions are focusable', staves.filter(s => s.getAttribute('tabindex') === '0').length, KEYS.length);
    eq('all staff descriptions have explicit labels', staves.filter(s => s.hasAttribute('aria-label')).length, KEYS.length);
    eq('dragging remains disabled', win.CF.config.dragEnabled, false);

    summary.className = failed ? 'fail' : 'pass';
    summary.textContent = failed
      ? `${failed} failed, ${passed} passed, ${passed + failed} total`
      : `all ${passed} assertions passed`;
    summary.dataset.passed = passed;
    summary.dataset.failed = failed;
    document.title = `${failed ? failed + ' FAILED' : 'PASS'} - Circle of Fifths interaction tests`;
  });
})();
</script>

</body>
</html>
